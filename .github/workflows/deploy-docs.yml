name: Deploy da documentação

on:
  push:
    branches: [main]
    paths:
      - "Documentacao/**"
      - ".github/workflows/deploy-docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Documentacao/package-lock.json

      - name: Instalar dependências
        working-directory: Documentacao
        run: npm ci

      - name: Build do Docusaurus
        working-directory: Documentacao
        run: npm run build

      - name: Publicar no gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: Documentacao/build
          publish_branch: gh-pages
